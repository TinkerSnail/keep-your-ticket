    const margin = {left:compact ? 32 : 48,right:compact ? 16 : 34,top:compact ? 34 : 44,bottom:compact ? 32 : 40};
    const scale = (width - margin.left - margin.right) / (domain.x1 - domain.x0);

    const height = margin.top + mapHeight + margin.bottom;

        if (!compact &amp;&amp; selected === &#x27;loops&#x27;) {
          addText(svg,ride.id,x(labelAt[0]),y(labelAt[1])+4,&#x27;ride-label&#x27;,&#x27;middle&#x27;);

    if ([&#x27;trunks&#x27;,&#x27;loops&#x27;,&#x27;service&#x27;,&#x27;qa&#x27;,&#x27;all&#x27;].includes(selected)) {

    const northX = x(domain.x1)-18;
    const northY = y(domain.z0)+22;

    svg.appendChild(make(&#x27;polygon&#x27;,{points:`${northX},${northY-8} ${northX-5},${northY+2} ${northX+5},${northY+2}`,class:&#x27;north-arrow&#x27;}));

    addText(svg,&#x27;40 m&#x27;,barX+20*scale,barY-7,&#x27;axis-copy&#x27;,&#x27;middle&#x27;);
    addText(svg,&#x27;WORLD X (m)&#x27;,x((domain.x0+domain.x1)/2),height-7,&#x27;axis-copy&#x27;,&#x27;middle&#x27;);
    addText(svg,&#x27;+Z SOUTH&#x27;,x(domain.x0)+3,y(domain.z0)+14,&#x27;axis-copy&#x27;);

    packageTitle.textContent = packages[selected].title;
    packageDetail.textContent = packages[selected].detail;
    select.value = selected;
    lastWidth = width;
  }

  select.addEventListener(&#x27;change&#x27;,event =&gt; {
    selected = event.target.value;
    draw();
  });

  const observer = new ResizeObserver(() =&gt; {
    const width = Math.max(288,Math.round(root.getBoundingClientRect().width || 736));
    if (width === lastWidth) return;
    requestAnimationFrame(draw);
  });
  observer.observe(root);
  draw();
})();

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

  let positionRequest = 0;
  let skipDelayUntil = 0;

  let pinnedByTouch = false;

      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    );

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

    openTimeout = window.setTimeout(() =&gt; {
