  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;desc id=&quot;rebuild-map-description&quot;&gt;A measured world-coordinate plan showing inherited paths to remove, protected monuments, final circulation, terrain edges, ride courts including the High Terrace steel coaster, programmed guest attractions, service access, the daylighted Coastal Creek, six locked navigation and sightline checks, and the day, closing-sweep, and after-hours photography mission spine.&lt;/desc&gt;

  &lt;section id=&quot;parcel-details&quot; aria-label=&quot;Resolved parcel and systems plans&quot; hidden&gt;

      &lt;h3&gt;R4 · Fairground swinging ship&lt;/h3&gt;
      &lt;svg id=&quot;r4-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;r4-parcel-title r4-parcel-description&quot;&gt;&lt;/svg&gt;

        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; Kinetic landmark with a dedicated ride-photo turnout.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; The operator panel permits one isolated cycle.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; C remains 8m clear; entry and exit stay separate; service stays locked during operation.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure data-detail=&quot;parcels&quot;&gt;
      &lt;h3&gt;P2 · Boardwalk walk-through funhouse&lt;/h3&gt;
      &lt;svg id=&quot;p2-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;p2-parcel-title p2-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; Continuous walk-through with a level tunnel bypass.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; One-way interior exploration retains a staff escape.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; B remains 10m clear; entry and exit land 13m apart.&lt;/span&gt;

    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;lighthouse&quot;&gt;
      &lt;h3&gt;P1 · Headland lighthouse experience&lt;/h3&gt;
      &lt;svg id=&quot;p1-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;p1-parcel-title p1-parcel-description&quot;&gt;&lt;/svg&gt;

        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; Timed tower groups begin in the keeper’s exhibit; the camera obscura supplies the accessible ground-level experience.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; The keeper-room control starts the beacon and reveals the lens-maintenance sequence.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; Entry and exit stay separate; structure bases retain at least 1.7m beyond the 10m loop; no service road is added.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;bigtop&quot;&gt;
      &lt;h3&gt;P3 · Fairground Big Top scheduled show&lt;/h3&gt;
      &lt;svg id=&quot;p3-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;p3-parcel-title p3-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; Timed 120-seat shows load from the north ticket queue and release separately to the east side of C.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; The backstage cue desk runs beacon, music, ring-light, and rigging cues while both performer gates remain locked.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; The tent retains 4.3m beyond C’s paving and 4.9m from R4; the backstage yard retains 2.0m beyond C; the show crossing never opens during audience load or release.&lt;/span&gt;

    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;playgarden&quot;&gt;
      &lt;h3&gt;P4 · Family commons play garden&lt;/h3&gt;
      &lt;svg id=&quot;p4-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;p4-parcel-title p4-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; Two monitored public gates make an optional walk-through; a 1.8m inclusive loop links toddler, climbing, and sensory zones while strollers, shade, and the family-photo position stay inside the fence.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; The public gates latch; the south staff gate reaches a cue panel that runs four garden lanterns, a music-box chime, and one slow turn of the play-tower windmill.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; The 18 × 14m fence retains 4.3m from D’s 9m arrival paving and 4.5m from its 8m circuit; both public gates return to D and the service path crosses no public route.&lt;/span&gt;

    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;bandstand&quot;&gt;
      &lt;h3&gt;P5 · Plaza bandstand performance court&lt;/h3&gt;
      &lt;svg id=&quot;p5-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;p5-parcel-title p5-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Day&lt;/b&gt; The relocated 12.4m bandstand faces a 96-chair event lawn with a level center aisle, four wheelchair-and-companion bays, two audience routes, ushers, and a dedicated photographer turnout.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; The locked stage-manager panel runs aisle lamps, footlights, canopy bulbs, and one short phonograph warm-up; performer gates stay shut.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; The event boundary retains 5.5m beyond the hub ring’s paving and 8.8m beyond B; the nearest structure remains 15.2m from NT-1. Audience holding, equipment load-in, and the photo bay never occupy a through-route.&lt;/span&gt;

    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;service&quot;&gt;
      &lt;h3&gt;05 · Service, drainage, and planting skeleton&lt;/h3&gt;
      &lt;svg id=&quot;service-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;service-parcel-title service-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Operations&lt;/b&gt; Three 4m back-of-house spines enter from separate gates, terminate in 12m turning heads, and connect every permanent ride yard; only the lighthouse and north Boardwalk use public paving, before opening.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Water&lt;/b&gt; D2 remains concealed only from the Plaza to its daylight point, then becomes Coastal Creek; the other five catchments end in planted detention or controlled waterfront outfalls. No swale, pipe, basin, or open water uses either protected monument as a drainage shortcut.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Planting&lt;/b&gt; Shade allées sit beyond public paving, service screens wrap cue and load yards, and deep-rooted slope bands stabilize the retained edges while landmark and photography sightlines stay low and open.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; The two west service spines stop 8m short of NT-1; no permanent service lane enters NT-1 or NT-2; S2 crosses the creek on one locked 4m culvert; tree trunks remain at least 2.5m beyond paving edges and every drainage arrow reaches detention or the controlled creek outfall.&lt;/span&gt;

    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;creek&quot;&gt;
      &lt;h3&gt;05A · Coastal Creek daylighting plan&lt;/h3&gt;
      &lt;svg id=&quot;creek-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;creek-parcel-title creek-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Water&lt;/b&gt; D2 emerges southeast of the Cascading Staircases as a 2.5–4m low-flow channel, meanders through an 8–12m planted corridor, widens into a 14 × 8m rain pond, and leaves through one controllable waterfront weir.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Crossings&lt;/b&gt; The funhouse garden loop crosses on a 4m footbridge and returns to B; B crosses on a full 10m promenade bridge; the locked S2 service spine uses one 4m culvert. No path ends at the water.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Edges&lt;/b&gt; Flood shelves, rushes, and low stone toes hold the ordinary banks. Hard retaining, railings, and headwalls are limited to bridge abutments and the outfall.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;After close&lt;/b&gt; Reflected ride lights, a slow current, and the pump-and-weir sound carry through the southwest seam without adding another attraction footprint.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; The planted corridor stays at least 7.2m outside NT-1 and 4.4m from the P2 foundation; both guest bridges retain their route widths; S2 stays locked; overflow reaches the outfall without entering public paving.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;qa&quot;&gt;
      &lt;h3&gt;06 · Navigation, sightlines, and reveal sequence&lt;/h3&gt;
      &lt;svg id=&quot;qa-parcel-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;qa-parcel-title qa-parcel-description&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;shot-recipes text-small&quot; aria-label=&quot;Locked canonical view directions&quot;&gt;
        &lt;span&gt;&lt;b&gt;Q1 · 000°&lt;/b&gt; Gate → Plaza fountain · lighthouse crown secondary&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Q2 · 271°&lt;/b&gt; Hub → Cascading Staircases · Boardwalk crowns held behind&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Q3 · 091°&lt;/b&gt; Boardwalk → Cascading Staircases · Plaza glow beyond&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Q4 · 029°&lt;/b&gt; Family threshold → Terraced Fountain · R13 crest secondary&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Q5 · 090°&lt;/b&gt; East axis → Terraced Fountain alone · coaster held right&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Q6 · 238°&lt;/b&gt; Upper terrace → Plaza panorama · Boardwalk skyline secondary&lt;/span&gt;
      &lt;/div&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Visibility&lt;/b&gt; Inside every yellow cone, foreground planting stays at or below 1.2m and no new opaque mass enters the named landmark’s silhouette. Trees frame cone edges; trunks never sit on the axis.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Hierarchy&lt;/b&gt; Each view has one primary landmark and at most one purple secondary landmark. Ride stations, service yards, queue roofs, and attraction backs remain concealed until the guest crosses their district threshold.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Night&lt;/b&gt; Every Q position retains one warm path anchor and one cooler landmark anchor; the next junction remains readable if all signs are removed.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; Walk A–F in both directions, clear J1–J9 without a pinch or cul-de-sac, capture Q1–Q6 at the locked bearings, preserve both monuments unchanged, and reject any tree, roof, queue, service gate, or ride base that breaks a cone.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;mission&quot;&gt;
      &lt;h3&gt;07 · One complete photography shift&lt;/h3&gt;
      &lt;div class=&quot;mission-ledger text-small&quot; aria-label=&quot;Canonical shift beats&quot;&gt;
        &lt;section&gt;
          &lt;h4&gt;Day assignments&lt;/h4&gt;
          &lt;span&gt;&lt;b&gt;H0 · 09:45&lt;/b&gt; Photo Hut · film, shot list, recurring faces&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M1 · 10:20&lt;/b&gt; Play garden · proximity, reactions, clean timing&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M2 · 12:15&lt;/b&gt; Terraced Fountain · foreground, depth, vertical layers&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M3 · 14:30&lt;/b&gt; High Terrace coaster · predict the ride cycle&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M4 · 16:45&lt;/b&gt; Lighthouse · timed group and an access clue&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M5 · 19:20&lt;/b&gt; Boardwalk / Cascade axis · crowd and sunset light&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M6 · 20:05&lt;/b&gt; Funhouse · lost-camera and claim-ticket thread&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;M7 · 21:10&lt;/b&gt; Swinging ship · recurring guest at show release&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;H1 · 21:45&lt;/b&gt; Photo Hut · handoff and closing brief&lt;/span&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h4&gt;Closing sweep&lt;/h4&gt;
          &lt;span&gt;&lt;b&gt;SW1&lt;/b&gt; Family kiosk · collect the first film box&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;SW2&lt;/b&gt; Fairground · restock print paper&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;SW3&lt;/b&gt; Boardwalk · collect the waterfront film box&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;SW4&lt;/b&gt; Headland · retrieve the forgotten gear case&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;SW5&lt;/b&gt; Upper terrace · return the ride-photo cassette&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;H2 · 22:30&lt;/b&gt; Photo Hut · the legitimate end of the sweep&lt;/span&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h4&gt;First unlocked night&lt;/h4&gt;
          &lt;span&gt;&lt;b&gt;N1&lt;/b&gt; Reuse the Terraced Fountain axis without signs&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;N2&lt;/b&gt; See impossible motion on the coaster crest&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;N3&lt;/b&gt; Reach the station and find the physical cause&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;N4&lt;/b&gt; Take the proof frame; the flash exposes the player&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;N5&lt;/b&gt; Escape by the learned northern loop, not a new route&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;H3&lt;/b&gt; Develop at the Photo Hut; discover the delayed background clue&lt;/span&gt;
        &lt;/section&gt;
      &lt;/div&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Home&lt;/b&gt; The Photo Hut is briefing room, handoff, night refuge, development room, and the place every loop returns to.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Progress&lt;/b&gt; Required assignment frames advance the shift; unclaimed prints and recovered disposable cameras fill the album instead of behaving like arbitrary pickups.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Failure&lt;/b&gt; Being caught ends only the current after-hours objective and returns the player to the Photo Hut; accepted earlier photographs remain.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Unlock&lt;/b&gt; Early shifts finish with sweep and development. Playable nights begin only when the player receives a flash-capable camera.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; Every M beat has a daytime job, photographic problem, learnable routine, access clue, after-close reuse, and developed-photo payoff. NT-1 and NT-2 remain completely unchanged.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;campaign&quot;&gt;
      &lt;h3&gt;08 · Assignment families and campaign progression&lt;/h3&gt;
      &lt;div class=&quot;campaign-ledger text-small&quot; aria-label=&quot;Assignment families and campaign phases&quot;&gt;
        &lt;section&gt;
          &lt;h4&gt;Six assignment families&lt;/h4&gt;
          &lt;span&gt;&lt;b&gt;A1 · People&lt;/b&gt; Portraits and posed groups teach proximity, direction, reactions, and recurring faces.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;A2 · Motion&lt;/b&gt; Rides, parades, and releases teach cycle reading, anticipation, and the decisive frame.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;A3 · Place&lt;/b&gt; Brochure work and picture spots teach light, layers, vantage routes, and looking behind the sanctioned view.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;A4 · Recovery&lt;/b&gt; Claim tickets, lost cameras, and unclaimed prints turn memory and observation into collection.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;A5 · Operations&lt;/b&gt; Booth triage, show calls, and crowd flow reveal schedules, doors, staff habits, and access windows.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;A6 · Evidence&lt;/b&gt; After-close proof frames combine route knowledge, concealment, flash risk, a mundane cause, and one residue.&lt;/span&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h4&gt;Five campaign phases&lt;/h4&gt;
          &lt;span&gt;&lt;b&gt;C1 · First week&lt;/b&gt; Instamatic, daylight, Photo Hut, Plaza, and family loop. Learn to stand close and wait.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;C2 · The routine&lt;/b&gt; The whole daytime park opens; optional posts trade clock time for schedules, faces, and doors.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;C3 · Flash shift&lt;/b&gt; A flash-capable camera opens the first playable night: the High Terrace coaster investigation.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;C4 · The wrong count&lt;/b&gt; Boardwalk, Creek, Grove, and Headland nights accumulate explanations while the same girl keeps returning in developed film.&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;C5 · Last roll&lt;/b&gt; A player-shaped shot list and final sweep use every learned loop, shortcut, recurring face, and album thread before morning.&lt;/span&gt;
        &lt;/section&gt;
      &lt;/div&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;Pacing&lt;/b&gt; A phase may span several shifts. Day remains the majority of play; not every sweep becomes a night.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Introduction rule&lt;/b&gt; No after-close target appears before the player has worked beside it in daylight and noticed its useful route or routine.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Assignment rule&lt;/b&gt; Every required subject has one useful off-axis detail, and every picture spot has an equally valuable reverse view.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Album&lt;/b&gt; Commissioned work, unclaimed prints, and recovered disposable cameras advance separate but overlapping picture threads.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Her&lt;/b&gt; She first reads as an ordinary recurring guest, later helps quietly after close, and is understood only when the film comes back.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; Every district supports at least three assignment families, one daylight routine worth learning, and one night reuse without adding a night-only route.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;figure class=&quot;parcel-wide&quot; data-detail=&quot;photo&quot;&gt;
      &lt;h3&gt;09 · Photograph lifecycle and mission resolution&lt;/h3&gt;
      &lt;svg id=&quot;photo-lifecycle-map&quot; class=&quot;parcel-map&quot; role=&quot;img&quot; aria-labelledby=&quot;photo-lifecycle-title photo-lifecycle-description&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;photo-ledger text-small&quot; aria-label=&quot;Exposure, resolution, and preservation rules&quot;&gt;
        &lt;section&gt;
          &lt;h4&gt;Recorded at exposure&lt;/h4&gt;
          &lt;span&gt;Rendered frame and film position&lt;/span&gt;
          &lt;span&gt;Time, camera pose, camera model, and flash&lt;/span&gt;
          &lt;span&gt;Identifiable subjects and their current states&lt;/span&gt;
          &lt;span&gt;Named ride, show, crowd, and world-event states&lt;/span&gt;
          &lt;span&gt;Background story flags captured independently&lt;/span&gt;
          &lt;span&gt;&lt;b&gt;Never:&lt;/b&gt; centering, thirds, beauty, or composition score&lt;/span&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h4&gt;Resolved after development&lt;/h4&gt;
          &lt;span&gt;The player sees every candidate before choosing one&lt;/span&gt;
          &lt;span&gt;The brief checks subject, required state, stated window, and stated vantage only&lt;/span&gt;
          &lt;span&gt;Possible results are &lt;b&gt;fulfilled&lt;/b&gt;, &lt;b&gt;unfilled&lt;/b&gt;, and &lt;b&gt;unexpected&lt;/b&gt;&lt;/span&gt;
          &lt;span&gt;Guest reactions remain human hints, never task confirmation&lt;/span&gt;
          &lt;span&gt;Requested subject and background discovery resolve separately&lt;/span&gt;
          &lt;span&gt;An unconventional but factually correct frame always counts&lt;/span&gt;
        &lt;/section&gt;
        &lt;section&gt;
          &lt;h4&gt;Preserved and routed&lt;/h4&gt;
          &lt;span&gt;Exposed photographs are immutable and never deleted as punishment&lt;/span&gt;
          &lt;span&gt;Being caught costs access and remaining opportunity, not the roll already shot&lt;/span&gt;
          &lt;span&gt;Commissioned work fills the job record&lt;/span&gt;
          &lt;span&gt;Unclaimed prints fill the park’s public memory&lt;/span&gt;
          &lt;span&gt;Disposable-camera rolls preserve other people’s complete days&lt;/span&gt;
          &lt;span&gt;Night evidence uses this exact pipeline; flash adds visibility risk at exposure&lt;/span&gt;
        &lt;/section&gt;
      &lt;/div&gt;
      &lt;figcaption class=&quot;parcel-notes text-small&quot;&gt;
        &lt;span&gt;&lt;b&gt;No instant grade&lt;/b&gt; Pressing the shutter spends film and creates an exposure. It does not complete an assignment on screen.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Candidate rule&lt;/b&gt; The player may take several versions because certainty arrives only when the roll is developed.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Objective facts&lt;/b&gt; “The coaster train at the crest” may be tested. “A well-composed coaster photograph” may not.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Two pictures in one&lt;/b&gt; The commissioned subject and whatever occupied the edge or background are stored and resolved independently.&lt;/span&gt;
        &lt;span&gt;&lt;b&gt;Pass&lt;/b&gt; Day, sweep, and night all use one exposure record, one development flow, and one preservation rule. No alternate supernatural camera system is introduced.&lt;/span&gt;
      &lt;/figcaption&gt;
    &lt;/figure&gt;
  &lt;/section&gt;

    all:{title:&#x27;All packages · one-way execution order&#x27;,detail:&#x27;Red work is removed first; amber cores and NT-1 / NT-2 are the only inherited circulation carried into routes A–F. R13 occupies the expanded outer high shoulder beyond the Terraced Fountain; R4 and P1–P5 are complete operating parcels, backed by the resolved S1–S3 service system, D1–D6 drainage catchments, PL1–PL3 planting structure, the daylighted D2 Coastal Creek, six locked reveal checks at Q1–Q6, the H0 / M1–M7 / SW1–SW5 / N1–N5 mission spine, assignment families A1–A6 across campaign phases C1–C5, and the L1–L9 photograph lifecycle from paper brief to preserved print.&#x27;},

    parcels:{title:&#x27;04A · Resolve the first attraction parcels&#x27;,detail:&#x27;R4 receives a 26 × 10m operating envelope, in-court queue, separate exit to C, operator booth, photo turnout, and gated back-lane service. P2 receives a 12 × 14m show building, separate Boardwalk entry and exit, continuous interior route, level tunnel bypass, façade photo point, and rear staff gate. Neither changes a public through-route.&#x27;},
    lighthouse:{title:&#x27;04B · Resolve the Headland lighthouse experience&#x27;,detail:&#x27;P1 keeps a 10m-diameter lighthouse on the boulevard axis, with a 14 × 8m low forecourt and an 8 × 6m keeper’s house to the west. Visitors enter through the exhibit, climb on the west stair, descend on the east stair, and rejoin the loop separately. A side-bay photo position keeps the boulevard clear; accessible camera-obscura content stays at ground level; servicing uses A only before opening.&#x27;},

    bandstand:{title:&#x27;04E · Resolve the Plaza bandstand performance court&#x27;,detail:&#x27;P5 moves the existing 12.4m bandstand to the north-west performance pocket, where it faces a 20 × 14m event lawn rather than the hub. Ninety-six removable chairs, a level center aisle, four wheelchair-and-companion bays, separate audience entry and release, two usher posts, and a side photo turnout make it operable. A 10 × 6m rear cue yard reaches the west service spine without crossing public circulation. A 5.5m no-queue strip keeps the full hub ring open during shows.&#x27;},

  function drawCoastalCreekCrossings(parent,x,y,scale,pathLine) {

  function sightConePoints(view) {
    const dx=view.primary[0]-view.at[0];
    const dz=view.primary[1]-view.at[1];
    const length=Math.hypot(dx,dz) || 1;
    const px=-dz/length;
    const pz=dx/length;
    const half=view.width/2;
    return [
      view.at,
      [view.primary[0]+px*half,view.primary[1]+pz*half],
      [view.primary[0]-px*half,view.primary[1]-pz*half]
    ];
  }

  function sightThresholdPoints(view) {
    const dx=view.primary[0]-view.at[0];
    const dz=view.primary[1]-view.at[1];
    const length=Math.hypot(dx,dz) || 1;
    const px=-dz/length;
    const pz=dx/length;
    return [
      [view.at[0]-px*5,view.at[1]-pz*5],
      [view.at[0]+px*5,view.at[1]+pz*5]
    ];
  }

  function drawSightlineLayer(parent,x,y,scale,points,pathLine,{compact=false,labels=true}={}) {

      pathLine([view.at,view.secondary],&#x27;sight-secondary&#x27;);
      pathLine(sightThresholdPoints(view),&#x27;threshold-axis&#x27;);
      parent.appendChild(make(&#x27;circle&#x27;,{

  function parcelCanvas(svgElement,localDomain,titleText,descriptionText,paint) {
    const width = Math.max(288,Math.round(svgElement.getBoundingClientRect().width || 340));
    const compact = width &lt; 330;
    const margin = {left:10,right:10,top:12,bottom:25};
    const scale = (width-margin.left-margin.right)/(localDomain.x1-localDomain.x0);
    const plotHeight = (localDomain.z1-localDomain.z0)*scale;
    const height = margin.top+plotHeight+margin.bottom;
    const x = value =&gt; margin.left+(value-localDomain.x0)*scale;
    const y = value =&gt; margin.top+(value-localDomain.z0)*scale;
    const points = values =&gt; values.map(point =&gt; `${x(point[0])},${y(point[1])}`).join(&#x27; &#x27;);
    const pathLine = (values,className,attrs={}) =&gt; {
      const el = make(&#x27;polyline&#x27;,{points:points(values),class:className,...attrs});
      svgElement.appendChild(el);
      return el;
    };
    const label = (copy,at,anchor=&#x27;start&#x27;) =&gt; addText(
      svgElement,copy,x(at[0]),y(at[1]),&#x27;parcel-label&#x27;,anchor
    );

    clear(svgElement);
    svgElement.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
    const title = make(&#x27;title&#x27;,{id:svgElement.id.replace(&#x27;-map&#x27;,&#x27;-title&#x27;)});
    title.textContent = titleText;
    const desc = make(&#x27;desc&#x27;,{id:svgElement.id.replace(&#x27;-map&#x27;,&#x27;-description&#x27;)});
    desc.textContent = descriptionText;
    svgElement.append(title,desc);
    svgElement.appendChild(make(&#x27;rect&#x27;,{
      x:x(localDomain.x0),y:y(localDomain.z0),
      width:(localDomain.x1-localDomain.x0)*scale,
      height:(localDomain.z1-localDomain.z0)*scale,class:&#x27;parcel-ground&#x27;
    }));
    const gridStep = localDomain.gridStep || 10;
    const firstX = Math.ceil(localDomain.x0/gridStep)*gridStep;
    const firstZ = Math.ceil(localDomain.z0/gridStep)*gridStep;
    for (let gx=firstX;gx&lt;=localDomain.x1;gx+=gridStep) {
      svgElement.appendChild(make(&#x27;line&#x27;,{
        x1:x(gx),y1:y(localDomain.z0),x2:x(gx),y2:y(localDomain.z1),class:&#x27;parcel-grid&#x27;
      }));
    }
    for (let gz=firstZ;gz&lt;=localDomain.z1;gz+=gridStep) {
      svgElement.appendChild(make(&#x27;line&#x27;,{
        x1:x(localDomain.x0),y1:y(gz),x2:x(localDomain.x1),y2:y(gz),class:&#x27;parcel-grid&#x27;
      }));
    }

    paint({svg:svgElement,x,y,scale,points,pathLine,label,compact,domain:localDomain});

    svgElement.appendChild(make(&#x27;rect&#x27;,{
      x:x(localDomain.x0),y:y(localDomain.z0),
      width:(localDomain.x1-localDomain.x0)*scale,
      height:(localDomain.z1-localDomain.z0)*scale,class:&#x27;parcel-frame&#x27;,&#x27;data-chart-frame&#x27;:&#x27;true&#x27;
    }));
    const barX=x(localDomain.x0)+9;
    const barY=y(localDomain.z1)-9;
    svgElement.appendChild(make(&#x27;line&#x27;,{
      x1:barX,y1:barY,x2:barX+10*scale,y2:barY,class:&#x27;scale-bar&#x27;
    }));
    addText(svgElement,&#x27;10m&#x27;,barX+5*scale,barY-6,&#x27;axis-copy&#x27;,&#x27;middle&#x27;);
    addText(svgElement,&#x27;+Z SOUTH&#x27;,x(localDomain.x0)+3,y(localDomain.z0)+14,&#x27;axis-copy&#x27;);
  }

        L2:{x:middle,y:18,w:stageWidth,h:stageHeight,kind:&#x27;field&#x27;,title:&#x27;L2 · FIND&#x27;,note:&#x27;routine + route&#x27;},
        L3:{x:right,y:18,w:stageWidth,h:stageHeight,kind:&#x27;field&#x27;,title:&#x27;L3 · FRAME&#x27;,note:&#x27;free aim · no snap&#x27;},

        L5:{x:right,y:192,w:stageWidth,h:stageHeight,kind:&#x27;soft&#x27;,title:&#x27;L5 · REACT&#x27;,note:&#x27;hint only · no result&#x27;},

        [centerX(stages.L5),stages.L5.y]

      flow([
        [stages.L4.x+stages.L4.w*0.7,stages.L4.y+stages.L4.h],
        [stages.L4.x+stages.L4.w*0.7,branchY],
        [centerX(stages.L6),branchY],
        [centerX(stages.L6),stages.L6.y]
      ]);
      const resolveY = stages.L6.y + stages.L6.h + 14;
      flow([
        [stages.L6.x+stages.L6.w*0.3,stages.L6.y+stages.L6.h],
        [stages.L6.x+stages.L6.w*0.3,resolveY],
        [centerX(stages.L7),resolveY],
        [centerX(stages.L7),stages.L7.y]
      ]);
      flow([
        [stages.L6.x+stages.L6.w*0.7,stages.L6.y+stages.L6.h],
        [stages.L6.x+stages.L6.w*0.7,resolveY],
        [centerX(stages.L8),resolveY],
        [centerX(stages.L8),stages.L8.y]
      ],&#x27;photo-discovery-flow&#x27;);
    } else {
      flow([[stages.L1.x+stages.L1.w,centerY(stages.L1)],[stages.L2.x,centerY(stages.L2)]]);
      flow([[stages.L2.x+stages.L2.w,centerY(stages.L2)],[stages.L3.x,centerY(stages.L3)]]);
      const frameY = stages.L3.y + stages.L3.h + 13;
      flow([
        [centerX(stages.L3),stages.L3.y+stages.L3.h],
        [centerX(stages.L3),frameY],
        [centerX(stages.L4),frameY],
        [centerX(stages.L4),stages.L4.y]
      ]);
      flow([[centerX(stages.L4),stages.L4.y+stages.L4.h],[centerX(stages.L6),stages.L6.y]]);
      flow([
        [stages.L4.x+stages.L4.w,centerY(stages.L4)],
        [centerX(stages.L5),centerY(stages.L4)],
        [centerX(stages.L5),stages.L5.y]
      ],&#x27;photo-soft-flow&#x27;);
      const resolveY = stages.L6.y + stages.L6.h + 13;
      flow([
        [stages.L6.x+stages.L6.w*0.35,stages.L6.y+stages.L6.h],
        [stages.L6.x+stages.L6.w*0.35,resolveY],

      [centerX(stages.L7),preserveY],
      [stages.L9.x+stages.L9.w*0.27,preserveY],
      [stages.L9.x+stages.L9.w*0.27,stages.L9.y]

    flow([

      [centerX(stages.L8),preserveY],

  function draw() {
    const width = Math.max(288,Math.round(root.getBoundingClientRect().width || 736));
    const compact = width &lt; 520;
    const photoMode = selected === &#x27;photo&#x27;;
    svg.toggleAttribute(&#x27;hidden&#x27;,photoMode);
    overlayKey.toggleAttribute(&#x27;hidden&#x27;,photoMode);
    const margin = {left:compact ? 32 : 48,right:compact ? 16 : 34,top:compact ? 34 : 44,bottom:compact ? 32 : 40};
    const scale = (width - margin.left - margin.right) / (domain.x1 - domain.x0);
    const mapHeight = (domain.z1 - domain.z0) * scale;
    const height = margin.top + mapHeight + margin.bottom;
    const x = value =&gt; margin.left + (value - domain.x0) * scale;
    const y = value =&gt; margin.top + (value - domain.z0) * scale;
    const points = values =&gt; values.map(point =&gt; `${x(point[0])},${y(point[1])}`).join(&#x27; &#x27;);
    const pathLine = (parent,values,className,attrs={}) =&gt; {
      const el = make(&#x27;polyline&#x27;,{points:points(values),class:className,...attrs});
      parent.appendChild(el);
      return el;
    };

    clear(svg);
    svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
    const title = make(&#x27;title&#x27;,{id:&#x27;rebuild-map-title&#x27;});
    title.textContent = `${packages[selected].title} on the park world-coordinate plan`;
    const desc = make(&#x27;desc&#x27;,{id:&#x27;rebuild-map-description&#x27;});
    desc.textContent = packages[selected].detail;
    svg.append(title,desc);

    svg.appendChild(make(&#x27;rect&#x27;,{
      x:x(domain.x0),y:y(domain.z0),width:(domain.x1-domain.x0)*scale,
      height:(domain.z1-domain.z0)*scale,class:&#x27;map-water&#x27;
    }));

    const gridStep = compact ? 80 : 40;
    for (let gx = -160; gx &lt;= 160; gx += gridStep) {
      svg.appendChild(make(&#x27;line&#x27;,{x1:x(gx),y1:y(domain.z0),x2:x(gx),y2:y(domain.z1),class:&#x27;map-grid&#x27;}));
      addText(svg,`${gx}`,x(gx),y(domain.z1)+18,&#x27;axis-copy&#x27;,&#x27;middle&#x27;);
    }
    for (let gz = -160; gz &lt;= 160; gz += gridStep) {
      svg.appendChild(make(&#x27;line&#x27;,{x1:x(domain.x0),y1:y(gz),x2:x(domain.x1),y2:y(gz),class:&#x27;map-grid&#x27;}));
      if (gz &gt; domain.z0 &amp;&amp; gz &lt; domain.z1) addText(svg,`${gz}`,x(domain.x0)-7,y(gz)+4,&#x27;axis-copy&#x27;,&#x27;end&#x27;);
    }
    svg.appendChild(make(&#x27;rect&#x27;,{
      x:x(domain.x0),y:y(domain.z0),width:(domain.x1-domain.x0)*scale,

            x:x(attraction.host.at[0]-attraction.host.size[0]/2),
            y:y(attraction.host.at[1]-attraction.host.size[1]/2),
            width:attraction.host.size[0]*scale,
            height:attraction.host.size[1]*scale,class:&#x27;parcel-booth&#x27;

        }
        if (attraction.host &amp;&amp; selected === &#x27;bandstand&#x27;) {
          svg.appendChild(make(&#x27;rect&#x27;,{

            y:y(attraction.host.at[1]-attraction.host.size[1]/2),

            svg.appendChild(make(&#x27;rect&#x27;,{
              x:x(attraction.host2.at[0]-attraction.host2.size[0]/2),
              y:y(attraction.host2.at[1]-attraction.host2.size[1]/2),

        if ((selected === &#x27;parcels&#x27; || selected === &#x27;bigtop&#x27; || selected === &#x27;playgarden&#x27; || selected === &#x27;bandstand&#x27; || selected === &#x27;service&#x27; || selected === &#x27;all&#x27;) &amp;&amp; attraction.service) {

          if (attraction.service2) pathLine(svg,attraction.service2,&#x27;service-line&#x27;);

        if ((selected === &#x27;parcels&#x27; || selected === &#x27;lighthouse&#x27; || selected === &#x27;bigtop&#x27; || selected === &#x27;playgarden&#x27; || selected === &#x27;bandstand&#x27;) &amp;&amp; attraction.photo) {

            cx:x(attraction.photo[0]),cy:y(attraction.photo[1]),r:compact?5:7,class:&#x27;parcel-photo&#x27;

    if ([&#x27;trunks&#x27;,&#x27;loops&#x27;,&#x27;service&#x27;,&#x27;qa&#x27;,&#x27;all&#x27;].includes(selected)) {

        (values,className,attrs={}) =&gt; pathLine(svg,values,className,attrs),
        {compact,labels:selected === &#x27;mission&#x27;});

    if (selected === &#x27;campaign&#x27; || selected === &#x27;all&#x27;) {
      drawCampaignLayer(svg,x,y,{compact,labels:selected === &#x27;campaign&#x27;});

    const northX = x(domain.x1)-18;
    const northY = y(domain.z0)+22;

    addText(svg,&#x27;WORLD X (m)&#x27;,x((domain.x0+domain.x1)/2),height-7,&#x27;axis-copy&#x27;,&#x27;middle&#x27;);
    addText(svg,&#x27;+Z SOUTH&#x27;,x(domain.x0)+3,y(domain.z0)+14,&#x27;axis-copy&#x27;);

    packageTitle.textContent = packages[selected].title;
    packageDetail.textContent = packages[selected].detail;
    const detailPackage = selected === &#x27;parcels&#x27; || selected === &#x27;lighthouse&#x27; || selected === &#x27;bigtop&#x27; || selected === &#x27;playgarden&#x27; || selected === &#x27;bandstand&#x27; || selected === &#x27;service&#x27; || selected === &#x27;creek&#x27; || selected === &#x27;qa&#x27; || selected === &#x27;mission&#x27; || selected === &#x27;campaign&#x27; || selected === &#x27;photo&#x27;;
    parcelDetails.hidden = !detailPackage;
    parcelFigures.forEach(figure =&gt; {
      figure.hidden = figure.dataset.detail !== selected;
    });
    if (selected === &#x27;parcels&#x27;) drawResolvedParcels();
    if (selected === &#x27;lighthouse&#x27;) drawLighthouseParcel();
    if (selected === &#x27;bigtop&#x27;) drawBigTopParcel();
    if (selected === &#x27;playgarden&#x27;) drawPlayGardenParcel();
    if (selected === &#x27;bandstand&#x27;) drawBandstandParcel();
    if (selected === &#x27;service&#x27;) drawServiceSystems();
    if (selected === &#x27;creek&#x27;) drawCoastalCreekPlan();
    if (selected === &#x27;qa&#x27;) drawSightlinePlan();
    if (selected === &#x27;photo&#x27;) drawPhotoLifecycle();
    select.value = selected;
    lastWidth = width;
  }

  select.addEventListener(&#x27;change&#x27;,event =&gt; {
    selected = event.target.value;
    draw();
  });

  const observer = new ResizeObserver(() =&gt; {
    const width = Math.max(288,Math.round(root.getBoundingClientRect().width || 736));
    if (width === lastWidth) return;
    requestAnimationFrame(draw);
  });
  observer.observe(root);
  draw();
})();

  const skipDelay = 300;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
