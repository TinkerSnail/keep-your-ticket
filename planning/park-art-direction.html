  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;section id=&quot;kyt-artboard&quot; aria-labelledby=&quot;kyt-artboard-title&quot;&gt;
  &lt;style&gt;
    #kyt-artboard {
      --kyt-teal: #2f8f89;
      --kyt-mustard: #d3a02d;
      --kyt-coral: #c75e49;
      --kyt-cobalt: #315f9d;
      --kyt-cream: #e6d4a8;
      --kyt-olive: #68704a;
      --kyt-ink: #292a2b;
      --kyt-fluoro: #a9c7a5;
      color: var(--foreground);
      width: 100%;
    }

    #kyt-artboard * { box-sizing: border-box; }
    #kyt-artboard h1,
    #kyt-artboard h2,
    #kyt-artboard h3,
    #kyt-artboard p { margin-top: 0; }
    #kyt-artboard h1 { margin-bottom: .35rem; }
    #kyt-artboard h2 { margin-bottom: .75rem; }
    #kyt-artboard h3 { margin-bottom: .25rem; }
    #kyt-artboard .kyt-thesis {
      color: var(--muted-foreground);
      margin-bottom: 1rem;
      max-width: 68ch;
    }
    #kyt-artboard .kyt-tabs { margin-bottom: 1rem; }
    #kyt-artboard [role=&quot;tabpanel&quot;][hidden] { display: none; }
    #kyt-artboard .kyt-frame-card { overflow: hidden; }
    #kyt-artboard .kyt-frame-card &gt; img {
      display: block;
      width: 100%;
      height: auto;
    }
    #kyt-artboard .kyt-frame-copy { padding: 1rem; }
    #kyt-artboard .kyt-kicker {
      color: var(--muted-foreground);
      margin-bottom: .2rem;
    }
    #kyt-artboard .kyt-frame-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem 1rem;
      margin-top: .8rem;
    }
    #kyt-artboard .kyt-fact-label {
      color: var(--muted-foreground);
      display: block;
      margin-bottom: .15rem;
    }
    #kyt-artboard .kyt-caption {
      color: var(--muted-foreground);
      margin: .65rem 0 0;
    }
    #kyt-artboard .kyt-section-note {
      color: var(--muted-foreground);
      margin-bottom: 1rem;
    }
    #kyt-artboard .kyt-ratio {
      display: flex;
      width: 100%;
      height: 1rem;
      overflow: hidden;
      margin: .5rem 0 .75rem;
      background: var(--muted);
    }
    #kyt-artboard .kyt-ratio &gt; span:nth-child(1) { width: 70%; background: var(--kyt-cream); }
    #kyt-artboard .kyt-ratio &gt; span:nth-child(2) { width: 20%; background: var(--kyt-teal); }
    #kyt-artboard .kyt-ratio &gt; span:nth-child(3) { width: 10%; background: var(--kyt-coral); }
    #kyt-artboard .kyt-ratio-labels {
      display: grid;
      grid-template-columns: 7fr 2fr 1fr;
      gap: .5rem;
      color: var(--muted-foreground);
      margin-bottom: 1.25rem;
    }
    #kyt-artboard .kyt-palette {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: .75rem 1rem;
      padding: 0;
      margin: 0 0 1.25rem;
    }
    #kyt-artboard .kyt-palette li {
      display: grid;
      grid-template-columns: 2.25rem 1fr;
      gap: .65rem;
      align-items: center;
    }
    #kyt-artboard .kyt-swatch {
      width: 2.25rem;
      height: 2.25rem;
    }
    #kyt-artboard .kyt-swatch-name { display: block; }
    #kyt-artboard .kyt-swatch-use { color: var(--muted-foreground); }
    #kyt-artboard .kyt-material-grid,
    #kyt-artboard .kyt-rule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: .8rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    #kyt-artboard .kyt-material,
    #kyt-artboard .kyt-rule {
      border-top: 1px solid var(--border);
      padding-top: .65rem;
    }
    #kyt-artboard .kyt-material p,
    #kyt-artboard .kyt-rule p { color: var(--muted-foreground); margin-bottom: 0; }
    #kyt-artboard .kyt-loop {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .5rem;
      align-items: stretch;
      margin-bottom: 1.25rem;
    }
    #kyt-artboard .kyt-loop-step {
      border-top: 3px solid var(--kyt-teal);
      padding-top: .55rem;
    }
    #kyt-artboard .kyt-loop-step:nth-child(2) { border-color: var(--kyt-mustard); }
    #kyt-artboard .kyt-loop-step:nth-child(3) { border-color: var(--kyt-coral); }
    #kyt-artboard .kyt-loop-step:nth-child(4) { border-color: var(--kyt-cobalt); }
    #kyt-artboard .kyt-loop-step:nth-child(5) { border-color: var(--kyt-fluoro); }
    #kyt-artboard .kyt-loop-step span { color: var(--muted-foreground); display: block; }
    #kyt-artboard .kyt-space-header,
    #kyt-artboard .kyt-space-row {
      display: grid;
      grid-template-columns: minmax(8rem, 1.05fr) minmax(10rem, 1.45fr) minmax(10rem, 1.45fr) minmax(9rem, 1.1fr);
      gap: 1rem;
      align-items: start;
    }
    #kyt-artboard .kyt-space-header {
      color: var(--muted-foreground);
      padding-bottom: .45rem;
    }
    #kyt-artboard .kyt-space-row {
      border-top: 1px solid var(--border);
      padding: .8rem 0;
    }
    #kyt-artboard .kyt-space-row p { margin-bottom: 0; }
    #kyt-artboard .kyt-space-name span { color: var(--muted-foreground); display: block; }
    #kyt-artboard .kyt-protected {
      border-left: 4px solid var(--kyt-mustard);
      padding-left: .75rem;
      margin-top: 1rem;
    }
    #kyt-artboard .kyt-protected p { color: var(--muted-foreground); margin-bottom: 0; }
    @media (max-width: 620px) {
      #kyt-artboard .kyt-frame-facts { grid-template-columns: 1fr; }
      #kyt-artboard .kyt-ratio-labels { grid-template-columns: 1fr; }
      #kyt-artboard .kyt-loop { grid-template-columns: 1fr; }
      #kyt-artboard .kyt-space-header { display: none; }
      #kyt-artboard .kyt-space-row { grid-template-columns: 1fr; gap: .4rem; }
      #kyt-artboard .kyt-space-row &gt; p::before {
        color: var(--muted-foreground);
        display: block;
      }
      #kyt-artboard .kyt-space-day::before { content: &quot;Day&quot;; }
      #kyt-artboard .kyt-space-night::before { content: &quot;After close&quot;; }
      #kyt-artboard .kyt-space-cue::before { content: &quot;Art anchor&quot;; }
    }

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);

      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();

            );

      })

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    setDescribedBy(trigger, true);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    if (pinnedByTouch) {
